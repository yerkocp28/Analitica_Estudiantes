# Comparabilidad de cohortes de ingreso, no ranking institucional.
target_name: UNIVERSIDAD AUTONOMA DE CHILE
minimum_cohort: 100
minimum_cluster: 3
k_values: [2, 3, 4, 5, 6]
random_seed: 42
nearest_peers: 5

# Proporcion maxima de universidades que puede concentrar un solo grupo.
#
# Sin este limite la silueta elige siempre k=2: separa cuatro instituciones
# atipicas y deja al 92% restante -- la UA incluida -- en un unico grupo. Esa
# particion tiene buena silueta (0,33 frente a ~0,11 del resto) porque aislar
# atipicos produce cortes limpios, pero como grupo de comparacion no dice
# nada: "mismo cluster que la UA" devolveria casi todas las universidades.
#
# La silueta mide separacion, no utilidad. Este umbral aporta lo segundo.
maximum_group_share: 0.5
block_weights:
  escala: 0.25
  areas: 0.25
  regiones: 0.25
  docencia: 0.25

# Valor promedio anual de la UF en pesos, para homologar aranceles.
#
# `formato_valores` de la matricula distingue "Monto en Pesos" de "Monto en
# UF": en 2024 son 145.862 y 7.638 filas respectivamente, con medianas de
# 4.986.900 y 215. Promediarlas sin convertir destruye la variable.
#
# Son promedios anuales aproximados. Si falta el anio, esas filas quedan como
# dato ausente en vez de mezclarse en otra unidad.
uf_clp:
  2023: 35500
  2024: 37700
  2025: 39200
