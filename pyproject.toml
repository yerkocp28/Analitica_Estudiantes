[project]
name = "student-analytics-ua"
version = "0.1.0"
description = "Plataforma de Student Analytics — Universidad Autonoma de Chile"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "pandera>=0.20",
    "pyarrow>=15.0",
]

[project.optional-dependencies]
modeling = ["scikit-learn>=1.4", "matplotlib>=3.8"]
ui = ["streamlit>=1.40", "altair>=5.0"]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
